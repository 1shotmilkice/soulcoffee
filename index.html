<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAIR-HgDpBD-Jh4hadL2o3Wp8FR4QGmVvFZPOyWIBqyHTrsYMDd6VPgGOO4Mg4zH2dVw/exec";
  
  // 마감 기한 설정: 2026년 10월 2일 23시 59분 59초
  const DEADLINE = new Date("2026-10-02T23:59:59");

  // 마감 상태 체크 함수
  function checkDeadline() {
    const now = new Date();
    if (now > DEADLINE) {
      document.getElementById('closedBanner').style.display = 'block';
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "사전 주문이 마감되었습니다";

      document.getElementById('school').disabled = true;
      document.querySelectorAll('.menu-check').forEach(chk => chk.disabled = true);
      document.querySelectorAll('.count-select').forEach(sel => sel.disabled = true);
      return true;
    }
    return false;
  }

  // 페이지 로드 시 마감 여부 체크
  checkDeadline();

  // 체크박스 클릭 시 잔 수 선택 활성화/비활성화
  document.querySelectorAll('.menu-check').forEach(chk => {
    chk.addEventListener('change', function() {
      const parent = this.closest('.menu-item');
      const select = parent.querySelector('.count-select');
      
      if (this.checked) {
        select.disabled = false;
        parent.classList.add('active');
      } else {
        select.disabled = true;
        parent.classList.remove('active');
      }
    });
  });

  // 폼 제출 이벤트 처리
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();

    if (checkDeadline()) {
      alert("주문 마감 기한(10월 2일)이 지나 더 이상 제출할 수 없습니다.");
      return;
    }
    
    const school = document.getElementById('school').value;
    const items = [];

    document.querySelectorAll('.menu-check:checked').forEach(chk => {
      const menuName = chk.getAttribute('data-menu');
      const parent = chk.closest('.menu-item');
      const countSelect = parent.querySelector('.count-select');

      items.push({
        menu: menuName,
        count: parseInt(countSelect.value, 10)
      });
    });

    if (items.length === 0) {
      alert("최소 하나 이상의 음료 메뉴를 선택해 주세요.");
      return;
    }

    if (!confirm(`[${school}] 기존 주문 내역이 있다면 삭제되고 새로 제출한 주문으로 업데이트됩니다. 제출하시겠습니까?`)) {
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "주문 처리 중...";

    const payload = JSON.stringify({
      school: school,
      items: items
    });

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: payload
    })
    .then(() => {
      alert(`[${school}] 음료 주문이 정상적으로 등록/수정되었습니다!`);
      this.reset();
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.count-select').forEach(el => el.disabled = true);
    })
    .catch(err => {
      alert("주문 처리 중 오류가 발생했습니다. 다시 시도해 주세요.");
      console.error(err);
    })
    .finally(() => {
      if (!checkDeadline()) {
        btn.disabled = false;
        btn.innerText = "사전 주문 제출하기";
      }
    });
  });
</script>

</body>
</html>
